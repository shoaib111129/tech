<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zyron Infotech</title>
    <link rel="icon" type="image/x-icon" href="Site_icons/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="Site_icons/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="Site_icons/favicon-96x96.png">
    <link rel="apple-touch-icon" href="Site_icons/apple-touch-icon.png">
    <link rel="manifest" href="Site_icons/site.webmanifest">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="header-container">
            <!-- LOGO -->
            <a href="#home" class="logo">
                <img src="logo.png" alt="Zyron Infotech" class="logo-img">
            </a>

            <!-- HAMBURGER MENU BUTTON (MOBILE ONLY) -->
            <button class="menu-btn" id="menuBtn" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <!-- NAVIGATION -->
            <nav class="nav" id="navMenu">
                <a href="#home" class="nav-link">Home</a>
                <a href="#about" class="nav-link">About</a>
                <a href="#services" class="nav-link">Services</a>
                <a href="#products" class="nav-link">Products</a>
                <a href="#careers" class="nav-link">Careers</a>
                <a href="#contact" class="nav-link">Contact</a>
            </nav>

            <!-- CTA BUTTON (DESKTOP ONLY) -->
            <a href="#contact" class="cta-btn">Get a Quote</a>
        </div>
    </header>

    <!-- OVERLAY (for mobile menu) -->
    <div class="overlay" id="overlay"></div>

    <!-- MAIN CONTENT -->
    <main class="container">
        <section class="hero">
            <h1>Welcome to Zyron Infotech</h1>
            <p>Innovative software solutions for your business</p>
        </section>
    </main>

    <script>
        // Mobile menu toggle
        const menuBtn = document.getElementById('menuBtn');
        const navMenu = document.getElementById('navMenu');
        const overlay = document.getElementById('overlay');

        function closeMenu() {
            navMenu.classList.remove('active');
            menuBtn.classList.remove('active');
            overlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        menuBtn.addEventListener('click', () => {
            navMenu.classList.toggle('active');
            menuBtn.classList.toggle('active');
            overlay.classList.toggle('active');
            document.body.style.overflow = navMenu.classList.contains('active') ? 'hidden' : '';
        });

        overlay.addEventListener('click', closeMenu);

        // Close menu when nav link clicked
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', closeMenu);
        });

        // Close menu on window resize (desktop)
        window.addEventListener('resize', () => {
            if (window.innerWidth > 768) {
                closeMenu();
            }
        });

    </script>
</body>
</html>
