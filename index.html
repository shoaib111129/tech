<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zyron Infotech</title>
    <link rel="icon" type="image/x-icon" href="Site_icons/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="Site_icons/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="Site_icons/favicon-96x96.png">
    <link rel="apple-touch-icon" href="Site_icons/apple-touch-icon.png">
    <link rel="manifest" href="Site_icons/site.webmanifest">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="header-container">
            <!-- LOGO -->
            <a href="#home" class="logo">
                <img src="logo.gif" alt="Zyron Infotech" class="logo-img" id="siteLogo">
            </a>

            <!-- NAVIGATION -->
            <nav class="nav" id="navMenu">
                <a href="#home" class="nav-link">Home</a>
                <a href="#about" class="nav-link">About</a>
                <a href="#services" class="nav-link">Services</a>
                <a href="#products" class="nav-link">Products</a>
                <a href="#careers" class="nav-link">Careers</a>
                <a href="#contact" class="nav-link">Contact</a>
            </nav>

            <!-- RIGHT-SIDE CONTROLS -->
            <div class="header-controls">
                <!-- SEARCH BUTTON -->
                <button class="search-btn" id="searchBtn" aria-label="Search">
                    <svg class="icon icon-search" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M21 21l-4.35-4.35" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="11" cy="11" r="6" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                    </svg>
                </button>

                <!-- MENU BUTTON (hamburger + close icons) -->
                <button class="menu-btn" id="menuBtn" aria-label="Toggle menu">
                    <svg class="icon icon-hamburger" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3 7h18" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M3 12h18" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M3 17h18" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <svg class="icon icon-close" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M18 6L6 18" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M6 6l12 12" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>

                <!-- CTA removed as requested -->
            </div>
        </div>
    </header>

    <!-- OVERLAY (for mobile menu) -->
    <div class="overlay" id="overlay"></div>

    <!-- MAIN CONTENT -->
    <main class="container">
        <section class="hero">
            <h1>Welcome to Zyron Infotech</h1>
            <p>Innovative software solutions for your business</p>
        </section>
    </main>

    <script>
        // Mobile menu toggle
        const menuBtn = document.getElementById('menuBtn');
        const navMenu = document.getElementById('navMenu');
        const overlay = document.getElementById('overlay');

        function closeMenu() {
            navMenu.classList.remove('active');
            menuBtn.classList.remove('active');
            overlay.classList.remove('active');
            document.body.style.overflow = '';
        }t

        menuBtn.addEventListener('click', () => {
            // On small screens toggle the slide-out drawer
            if (window.innerWidth <= 768) {
                navMenu.classList.toggle('active');
                menuBtn.classList.toggle('active');
                overlay.classList.toggle('active');
                document.body.style.overflow = navMenu.classList.contains('active') ? 'hidden' : '';
            } else {
                // On desktop just toggle icon state (visual feedback)
                menuBtn.classList.toggle('active');
            }
        });

        overlay.addEventListener('click', closeMenu);

        // Close menu when nav link clicked
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', closeMenu);
        });

        // Close menu on window resize (desktop)
        window.addEventListener('resize', () => {
            if (window.innerWidth > 768) {
                closeMenu();
            }
        });

        // Logo: use GIF only; clicking the logo restarts the GIF (replays animation)
        (function() {
            const logo = document.getElementById('siteLogo');
            if (!logo) return;
            const gifSrc = 'logo.gif';

            // Ensure GIF is used
            logo.src = gifSrc;

            // Restart GIF on click by briefly clearing src and restoring it
            logo.addEventListener('click', (e) => {
                e.preventDefault();
                // Quick reset to force replay
                logo.src = '';
                setTimeout(() => { logo.src = gifSrc; }, 20);
            });
        })();

    </script>
</body>
</html>
